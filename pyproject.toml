[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-research-extension"
version = "0.1.0"
description = "Research-facing tooling around the diffusion noise sensitivity notebooks and saved artifacts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
app = [
  "gradio>=5.0"
]
eval = [
  "torch>=2.0",
  "torchvision>=0.15"
]
all = [
  "gradio>=5.0",
  "torch>=2.0",
  "torchvision>=0.15"
]

[project.scripts]
genai-research = "research_extension.cli:main"

[tool.setuptools.packages.find]
include = ["research_extension*"]
